apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa   #User for my app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nginx-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]     #The user can only view pods but cant create or delete pods
---  #Role binding to give the user the role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nginx-binding
subjects:
- kind: ServiceAccount
  name: nginx-sa
roleRef:
  kind: Role
  name: nginx-role
  apiGroup: rbac.authorization.k8s.io    # I only give nginx-sa the permission it needs incase it get compromised by hackers #PRINCIPLE OF LEAST PRIVILEGE