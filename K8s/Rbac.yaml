apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa   # User for my app
  namespace: default
  labels:
    app: nginx-deploy

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nginx-role
  namespace: default

rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]     # The user can only view pods but can't create or delete pods

---
# Role binding to give the user the role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nginx-binding
  namespace: default

subjects:
- kind: ServiceAccount
  name: nginx-sa
  namespace: default

roleRef:
  kind: Role
  name: nginx-role
  apiGroup: rbac.authorization.k8s.io    # I only give nginx-sa the permission it needs in case it gets compromised by hackers
                                      # PRINCIPLE OF LEAST PRIVILEGE