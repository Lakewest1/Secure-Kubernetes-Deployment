apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
  labels:
    app: nginx-deploy

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-deploy

  template:
    metadata:
      labels:
        app: nginx-deploy

    spec:
      serviceAccountName: nginx-sa      #Added the Service Account 

      containers:
      - name: my-nginx-app1
        image: securek8sacr01.azurecr.io/secure-nginx:f12214058cd0e11d8b77dbe5ce0de799a777801f #Update with AKS Image
        imagePullPolicy: Always

        ports:
          - containerPort: 8080

        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

        volumeMounts:
          - name: tmp-volume
            mountPath: /tmp
          - name: cache-volume
            mountPath: /var/cache/nginx

        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-allow-http
spec:
  podSelector:
    matchLabels:
      app: nginx-deploy
  policyTypes:
  - Ingress
  ingress:
  - from: []
    ports:
    - protocol: TCP
      port: 8080                   #Allow all users to connect to my app but only on port 8080

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa   # Identity used by my application
  namespace: default
  labels:
    app: nginx-deploy

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nginx-role
  namespace: default

rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]     # Can only view pods but cannot create or delete pods

---
# Bind the role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nginx-binding
  namespace: default

subjects:
- kind: ServiceAccount
  name: nginx-sa
  namespace: default

roleRef:
  kind: Role
  name: nginx-role
  apiGroup: rbac.authorization.k8s.io

# Principle of Least Privilege:
# nginx-sa receives only the permissions required by the workload.
# If the workload is compromised, the attacker's Kubernetes permissions
# are limited to getting and listing pods in this namespace.

---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
type: Opaque          #Generic Secret 
data:
  message: SGVsbG8=    #Base64 Encoded and it Decode means : Hello.  
                       #IT means “Store ‘Hello’ securely as a secret”

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx-deploy

spec:
  type: NodePort
  selector:
    app: nginx-deploy

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30007

---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirednonroot
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirednonroot

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not container.securityContext.runAsNonRoot
          msg := "Containers must set securityContext.runAsNonRoot to true"
        }

---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredNonRoot
metadata:
  name: require-non-root
spec:
  match:
    kinds:
      - apiGroups:
          - apps
        kinds:
          - Deployment